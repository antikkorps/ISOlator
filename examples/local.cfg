# local.cfg - hand-written entries; copy to MULTIBOOT:/multiboot/local.cfg
# Included at the end of the generated menu, never overwritten by gen-menu.py.

# Boot the system installed on the internal disk (hands over to its own GRUB).
# Replace XXXX-XXXX with the volume ID of the internal EFI partition:
#   lsblk -no UUID /dev/nvme0n1p1
menuentry "Debian (internal disk)" --class debian {
    search --no-floppy --fs-uuid --set=root XXXX-XXXX
    if [ -f /EFI/debian/shimx64.efi ]; then
        chainloader /EFI/debian/shimx64.efi
    else
        chainloader /EFI/debian/grubx64.efi
    fi
}
