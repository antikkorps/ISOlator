# isolator.toml - menu settings; copy to MULTIBOOT:/multiboot/isolator.toml
# then run ./gen-menu.py. Every key is optional; unknown keys are refused.
# Paths are relative to the MULTIBOOT partition and start with "/".

[menu]
# Seconds before the default entry boots; -1 waits for a key press.
timeout = 10

# ISO booted when the timeout expires (its path; case is ignored, as on exFAT).
default = "/x86_64/ubuntu-26.04-desktop-amd64.iso"

# Entries matching these patterns come first, in this order; the others
# follow, sorted by title. Patterns ignore case; * also crosses "/".
order = ["/x86_64/ubuntu-*", "/x86_64/linuxmint-*"]

# Entries matching these patterns are left out of the menu.
hidden = ["/x86_64/old/*"]

# Group the entries into submenus: "Installers" and "Live systems", sorted by
# what each ISO is. Off by default (one flat menu).
submenus = true

# Custom submenus: entries matching `match` go into a submenu with this title
# (A-Z a-z 0-9 space . _ + ( ) - only, starting with a letter or digit).
# They are filled before the automatic ones and listed after them; an entry
# goes to the first submenu it matches. They also work with
# `submenus = false`: the other entries stay at the top.
[[menu.submenu]]
title = "Tools"
match = ["/tools/*"]
